    this.flags[4] = r.c;
    s.l = s.x;
    s.x = r.raw;
    this.lift = true;
    this._record(label);
  }

  _carryOp(fn, label) {
    this._commit();
    const s = this.st;
    const r = fn(s.x, this.ws, this.flags[4]);
    this.flags[4] = r.c;
    s.l = s.x;
    s.x = r.raw;
    this.lift = true;
    this._record(label);
  }

  // RLn, RRn, RLCn, RRCn: giram Y pelas X posições; o resultado fica em X.
  _rotN(left, carry, label) {
    this._commit();
    const s = this.st;
    const n = s.x > 255n ? 255 : Number(s.x);
    let v = s.y;
    let c = this.flags[4];
    for (let i = 0; i < n; i++) {
      const r = left ? rotLeft(v, this.ws, carry ? c : null) : rotRight(v, this.ws, carry ? c : null);
      v = r.raw;
      c = r.c;
    }
    this.flags[4] = n === 0 ? this.flags[4] : c;
    s.l = s.x;
    s.x = v;
    this._drop();
    this.lift = true;
    this._record(label);
  }

  _maskOp(left) {
    this._commit();
    const s = this.st;
    if (s.x > BigInt(this.ws)) throw arg('Número de bits inválido');
    const n = Number(s.x);
    const low = (1n << BigInt(n)) - 1n;
    s.l = s.x;
    s.x = left ? low << BigInt(this.ws - n) : low;
    this.lift = true;
    this._record(left ? 'MASKL' : 'MASKR');
  }

  // ---------- g ----------
  _g(key) {
    const id = key.id;
    const s = this.st;
    switch (id) {
      case 'da': return this._leftJustify();
      case 'db': return this._shiftOp((raw, ws) => asr(raw, ws), 'ASR');
      case 'dc': return this._carryOp(rotLeft, 'RLC');
      case 'dd': return this._carryOp(rotRight, 'RRC');
      case 'de': return this._rotN(true, true, 'RLCn');
      case 'df': return this._rotN(false, true, 'RRCn');
      case '7': return this._unary((x) => ({ raw: BigInt(popcount(x)) }), '#B', '');
      case '8': return this._unary((x, ws, cmp) => this._abs(x, ws, cmp), 'ABS', 'g');
      case 'oct': return this._unary((x, ws, cmp) => this._sqrt(x, ws, cmp), '√x');
      case 'bin': return this._unary((x, ws, cmp) => this._recip(x, ws, cmp), '1/x');
      case '4': this._commit(); this.pending = 'sf'; return;
      case '5': this._commit(); this.pending = 'cf'; return;
      case 'times': return this._dblMul();
      case 'divide': return this._dblDiv(false);
      case '9': return this._dblDiv(true);
      case 'rdown': {
        this._commit();
        [s.x, s.y, s.z, s.t] = [s.t, s.x, s.y, s.z];
        this.lift = true;
        this.tokens.push('R↑');
        return;
      }
      case 'bsp':
        return this._clx();
      case 'enter':
        this._commit();
        this._push(s.l);
        this.tokens.push('LSTx');
        return;
      case 'sto': return this._scroll(1);
      case 'rcl': return this._scroll(-1);
    }
  }

  _abs(x, ws, cmp) {
    if (cmp === 'u') return { raw: x, g: false };
    const sv = toSigned(x, ws, cmp);
    if (sv >= 0n) return { raw: x, g: false };
    if (!inRange(-sv, ws, cmp)) return { raw: x, g: true };
    return { raw: toRaw(-sv, ws, cmp), g: false };
  }

  _sqrt(x, ws, cmp) {
    const sv = toSigned(x, ws, cmp);
    if (sv < 0n) return null; // raiz de negativo: Error 0
    const r = isqrt(sv);
    return { raw: r, c: r * r !== sv, g: false };
  }

  _recip(x, ws, cmp) {
    const sv = toSigned(x, ws, cmp);
    if (sv === 0n) return null;
    const one = 1n;
    const q = one / sv; // trunca: só ±1 dá diferente de zero
    return { raw: toRaw(q, ws, cmp), c: one % sv !== 0n, g: false };
  }

  _leftJustify() {
    this._commit();
    const s = this.st;
    const r = leftJustify(s.x, this.ws);
    s.l = s.x;
    this._rise();
    s.y = r.raw;
    s.x = BigInt(r.n);
    this.lift = true;
    this._record('LJ');
  }

  // Multiplicação e divisão de precisão dupla: o par Y:X (ou Z:Y) guarda um número de 2·ws bits.
  _dbl(hi, lo) {
    const w = BigInt(this.ws);
    const v = (hi << w) | lo;
    return this.cmp === 'u' ? v : BigInt.asIntN(this.ws * 2, v);
  }

  _dblMul() {
    this._commit();
    const s = this.st;
    const p = toSigned(s.y, this.ws, this.cmp) * toSigned(s.x, this.ws, this.cmp);
    const u = BigInt.asUintN(this.ws * 2, p);
    s.l = s.x;
    s.x = u & maskOf(this.ws);
    s.y = u >> BigInt(this.ws);
    this.flags[5] = false;
    this.lift = true;
    this._record('DBL×');
  }

  _dblDiv(remainder) {
    this._commit();
    const s = this.st;
    const sx = toSigned(s.x, this.ws, this.cmp);
    if (sx === 0n) throw new CalcError(0);
    const n = this._dbl(s.z, s.y);
    const r = remainder ? n % sx : n / sx;
    const ok = inRange(r, this.ws, this.cmp);
    s.l = s.x;
    s.x = ok ? toRaw(r, this.ws, this.cmp) : BigInt.asUintN(this.ws, r);
    s.y = s.t;
    s.z = s.t;
    this.flags[5] = !ok;
    this.flags[4] = !remainder && n % sx !== 0n;
    this.lift = true;
    this._record(remainder ? 'DBLR' : 'DBL÷');
  }

  _scroll(dir) {
    const max = this._windowCount(this.st.x) - 1;
    this.window = Math.max(0, Math.min(Math.max(0, max), this.window + dir));
  }

  // ---------- STO, RCL, bits, flags, janela ----------
  _finishPending(key) {
    const mode = this.pending;
    this.pending = null;
    const id = key.id;
    const d = digitOf(id);
    const s = this.st;
    if (mode === 'sto' || mode === 'rcl' || mode === 'sto.' || mode === 'rcl.') {
      if (id === 'dot' && !mode.endsWith('.')) {
        this.pending = mode + '.';
        return;
      }
      if (d === null) return;
      const n = parseInt(d, 16) + (mode.endsWith('.') ? 16 : 0);
      if (n >= this.regs.length) throw new CalcError(6);
      const label = `${mode.startsWith('sto') ? 'STO' : 'RCL'} ${mode.endsWith('.') ? '.' : ''}${d}`;
      if (mode.startsWith('sto')) {
        this.regs[n] = s.x;
        this.lift = true;
      } else this._push(this.regs[n]);
      this._record(label);
      return;
    }
    if (d === null) return;
    const n = parseInt(d, 16);
    if (mode === 'window') {
      if (n > 7) throw arg('Janela inválida');
      this.window = n;
    } else if (mode === 'sf' || mode === 'cf') {
      if (n > 5) throw arg('Flag inválido');
      this.flags[n] = mode === 'sf';
    } else {
      if (n >= this.ws) throw arg('Bit inexistente');
      s.x = mode === 'sb' ? s.x | (1n << BigInt(n)) : s.x & ~(1n << BigInt(n));
      this.lift = true;
      this._record(mode === 'sb' ? `SB ${d}` : `CB ${d}`);
    }
  }

  // ---------- visor ----------
  _windowCount(raw) {
    const len = digitsOf(raw, this.ws, this.cmp, this.base, this.flags[3]).replace('-', '').length;
    return Math.ceil(len / WIN[this.base]);
  }

  // Texto de um valor na base (a atual, se não vier outra) e janela dadas; o fim do número é a janela 0.
  _valText(raw, window = this.window, base = this.base) {
    const full = digitsOf(raw, this.ws, this.cmp, base, this.flags[3]);
    return this._slice(full, window, base);
  }

  _slice(full, window, base) {
    const neg = full.startsWith('-');
    const digits = neg ? full.slice(1) : full;
    const size = WIN[base];
    const end = digits.length - window * size;
    const part = end <= 0 ? '0' : digits.slice(Math.max(0, end - size), end);
    return (neg && window === 0 ? '-' : '') + part + ' ' + LETTER[base];
  }

  _display() {
    if (this.error) return 'Error ' + this.error.code;
    if (this.temp !== null) return this.temp;
    if (this.entry !== null) return this._slice(this.entry === '' ? '0' : this.entry, 0, this.base);
    return this._valText(this.st.x);
  }

  _record(label) {
    this.tokens.push(label);
    this.tape.push({ keys: this.tokens.join(' '), label, value: String(this.st.x), text: this._valText(this.st.x, 0) });
    if (this.tape.length > MAX_TAPE) this.tape.shift();
    this.tokens = [];
  }

  // ---------- serialização ----------
  serialize() {
    const s = this.st;
    return JSON.stringify({
      v: VERSION,
      profile: this.profile,
      ws: this.ws,
      cmp: this.cmp,
      base: this.base,
      st: { x: String(s.x), y: String(s.y), z: String(s.z), t: String(s.t), l: String(s.l) },
      flags: this.flags,
      regs: this.regs.map(String),
      entry: this.entry,
      lift: this.lift,
      shift: this.shift,
      pending: this.pending,
      window: this.window,
      locale: this.locale,
      error: this.error,
      tape: this.tape,
      tokens: this.tokens,
    });
  }

  static restore(json) {
    const o = JSON.parse(json);
    const big = (v, ws) => {
      if (typeof v !== 'string' || !/^[0-9]+$/.test(v)) throw bad();
      const b = BigInt(v);
      if (b > maskOf(ws)) throw bad();
      return b;
    };
    if (!o || typeof o !== 'object' || o.v !== VERSION) throw bad();
    if (typeof o.profile !== 'string') throw bad();
    if (!Number.isInteger(o.ws) || o.ws < 1 || o.ws > 64) throw bad();
    if (!['2', '1', 'u'].includes(o.cmp) || !['hex', 'dec', 'oct', 'bin'].includes(o.base)) throw bad();
    if (!o.st || !Array.isArray(o.flags) || o.flags.length !== 6 || !o.flags.every((f) => typeof f === 'boolean')) throw bad();
    if (!Array.isArray(o.regs) || !Array.isArray(o.tape) || !Array.isArray(o.tokens)) throw bad();
    if (o.locale !== 'br' && o.locale !== 'us') throw bad();
    if (![null, 'f', 'g'].includes(o.shift) || ![null, 'sto', 'rcl', 'sto.', 'rcl.', 'sb', 'cb', 'sf', 'cf', 'window'].includes(o.pending)) throw bad();
    if (o.entry !== null && !(typeof o.entry === 'string' && /^[0-9A-F]*$/.test(o.entry))) throw bad();
    const e = new Engine16({ locale: o.locale, profile: o.profile });
    Object.assign(e, {
      ws: o.ws,
      cmp: o.cmp,
      base: o.base,
      flags: [...o.flags],
      entry: o.entry,
      lift: o.lift !== false,
      shift: o.shift,
      pending: o.pending,
      window: Number.isInteger(o.window) && o.window >= 0 && o.window < 8 ? o.window : 0,
      error: o.error && Number.isInteger(o.error.code) ? { code: o.error.code, message: String(o.error.message) } : null,
      tape: o.tape.filter((r) => r && typeof r.keys === 'string' && typeof r.text === 'string').map((r) => ({ keys: r.keys, label: String(r.label), value: String(r.value), text: r.text })),
      tokens: o.tokens.map(String),
    });
    for (const k of ['x', 'y', 'z', 't', 'l']) e.st[k] = big(o.st[k], o.ws);
    o.regs.slice(0, e.regs.length).forEach((v, n) => { e.regs[n] = big(v, o.ws); });
    return e;
  }
}

return { Engine16 };
})();

const __m_engines = (() => {
// Escolhe o motor pelo tipo do perfil: decimal (HP 10C a 12C) ou inteiros de largura fixa (HP-16C).
const { Engine } = __m_engine;
const { Engine16 } = __m_engine16;
const { DEFAULT_PROFILE, getProfile, hasProfile } = __m_profiles;

function createEngine(opts = {}) {
  const profile = opts.profile ?? DEFAULT_PROFILE;
  return getProfile(profile).kind === 'int' ? new Engine16({ ...opts, profile }) : new Engine({ ...opts, profile });
}

function restoreEngine(json) {
  const o = JSON.parse(json);
  const id = o && typeof o === 'object' ? o.profile : undefined;
  if (typeof id === 'string' && hasProfile(id) && getProfile(id).kind === 'int') return Engine16.restore(json);
  return Engine.restore(json);
}

return { createEngine, restoreEngine };
})();

const __m_display = (() => {
// Visor: indicadores (conforme o perfil), dígitos com ajuste de fonte, mensagem de erro e teclado do PC.
const { getProfile } = __m_profiles;

const INDICATORS = getProfile('12c').indicators;

function ensureStructure(el, indicators) {
  const sig = indicators.join('|');
  if (el.querySelector('.digits') && el.dataset.inds === sig) return;
  el.dataset.inds = sig;
  el.innerHTML =
    '<div class="indicators">' + indicators.map((i) => `<span data-ind="${i}">${i}</span>`).join('') +
    '<button type="button" class="fmt-toggle" aria-label="Alternar formato dos números (pt-BR / en-US)"></button></div>' +
    '<div class="digits" role="status"></div><div class="msg"></div>';
}

// Reduz a fonte até o texto caber na largura do visor.
function fit(digits) {
  digits.style.fontSize = '';
  let size = parseFloat(getComputedStyle(digits).fontSize);
  while (digits.scrollWidth > digits.clientWidth && size > 14) {
    size -= 2;
    digits.style.fontSize = size + 'px';
  }
}

function renderDisplay(el, s) {
  ensureStructure(el, getProfile(s.profile ?? '12c').indicators);
  const lit = {
    RPN: s.mode === 'rpn', ALG: s.mode === 'alg', '( )': s.parens > 0,
    f: s.shift === 'f', g: s.shift === 'g', BEGIN: s.begin, C: s.compound || s.carry === true, 'D.MY': s.dmy, PRGM: s.prgm, UNDO: s.undo === true, G: s.oor === true,
  };
  for (const span of el.querySelectorAll('[data-ind]')) {
    span.classList.toggle('on', !!lit[span.dataset.ind]);
  }
  el.querySelector('.fmt-toggle').textContent = s.locale === 'br' ? 'BR' : 'US';
  el.querySelector('.digits').textContent = s.display;
  el.querySelector('.msg').textContent = s.error ? s.error.message : '';
  fit(el.querySelector('.digits'));
}

const KEY_TO_ID = {
  ',': 'dot', '.': 'dot', Enter: 'enter', '+': 'plus', '-': 'minus', '*': 'times', x: 'times', '/': 'divide',
};

// Teclado do PC: dígitos, vírgula/ponto, Enter, + − × ÷ e Backspace.
function bindKeyboard(engine, onChange = () => {}, target = window) {
  const handler = (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === 'Backspace') {
      ev.preventDefault();
      engine.backspace();
    } else {
      const hex = getProfile(engine.profile).kind === 'int' && /^[a-fA-F]$/.test(ev.key) ? 'd' + ev.key.toLowerCase() : null; // letras A-F na 16C
      const id = hex ?? (/^[0-9]$/.test(ev.key) ? ev.key : KEY_TO_ID[ev.key]);
      if (!id) return;
      ev.preventDefault();
      engine.press(id);
    }
    onChange();
  };
  target.addEventListener('keydown', handler);
  return () => target.removeEventListener('keydown', handler);
}

return { INDICATORS, renderDisplay, bindKeyboard };
})();

const __m_storage = (() => {
// Salvamento automático no aparelho (localStorage). Nada sai do dispositivo.
const { createEngine, restoreEngine } = __m_engines;
const { DEFAULT_PROFILE, hasProfile } = __m_profiles;

const STORAGE_KEY = 'calc12c.state'; // estado do perfil 12C (chave mantida para não perder o que já estava salvo)
const PROFILE_KEY = 'calc12c.profile'; // perfil em uso

// Cada perfil tem o seu estado salvo à parte.
const stateKey = (id) => (id === DEFAULT_PROFILE ? STORAGE_KEY : `${STORAGE_KEY}.${id}`);

function store() {
  try {
    return window.localStorage; // pode lançar (bloqueado) ou ser nulo
  } catch {
    return null;
  }
}

function saveState(engine) {
  try {
    store()?.setItem(stateKey(engine.profile), engine.serialize());
  } catch {
    /* sem armazenamento: o app segue funcionando */
  }
}

// Perfil em uso: ausente ou desconhecido → 12C.
function loadActiveProfile() {
  try {
    const id = store()?.getItem(PROFILE_KEY);
    if (id && hasProfile(id)) return id;
  } catch {
    /* usa o padrão */
  }
  return DEFAULT_PROFILE;
}

function saveActiveProfile(id) {
  try {
    store()?.setItem(PROFILE_KEY, id);
  } catch {
    /* sem armazenamento: o app segue funcionando */
  }
}

// Estado salvo do perfil (o ativo, se não for dito) ausente, corrompido ou de versão antiga → motor novo (sem erro).
function loadState(profile = loadActiveProfile()) {
  try {
    const raw = store()?.getItem(stateKey(profile));
    if (raw) {
      const e = restoreEngine(raw);
      if (e.profile === profile) return e;
    }
  } catch {
    /* cai no estado inicial */
  }
  return createEngine({ profile });
}

function clearAll(profile = DEFAULT_PROFILE) {
  try {
    store()?.removeItem(stateKey(profile));
  } catch {
    /* ignora */
  }
}

return { STORAGE_KEY, PROFILE_KEY, stateKey, saveState, loadActiveProfile, saveActiveProfile, loadState, clearAll };
})();

const __m_tape = (() => {
// Gaveta do visor: fita de cálculo e memória viva (n, i, PV, PMT, FV, R0–R9, pilha).
const { formatNumber } = __m_number;
const { clearAll } = __m_storage;

const FIN_CARDS = [['n', 'n'], ['i', 'i'], ['pv', 'PV'], ['pmt', 'PMT'], ['fv', 'FV']];
const STACK_REGS = [['x', 'X'], ['y', 'Y'], ['z', 'Z'], ['t', 'T']];
const SWIPE_PX = 40;

const cell = (cls, attr, label, value) =>
  `<div class="${cls}" ${attr}><span class="k">${label}</span><span class="v">${value}</span></div>`;

function mountDrawer(ctx) {
  const { calc, top, display, engine } = ctx;
  const handle = document.createElement('button');
  handle.type = 'button';
  handle.className = 'drawer-handle';
  handle.setAttribute('aria-expanded', 'false');
  handle.setAttribute('aria-label', 'Abrir ou fechar a fita e a memória');
  const drawer = document.createElement('section');
  drawer.className = 'drawer';
  drawer.dataset.open = 'false';
  drawer.innerHTML =
    '<div class="mem"></div><div class="tape-wrap"><ol class="tape"></ol>' +
    '<button type="button" class="clear-all">Limpar tudo</button></div>' +
    '<div class="confirm" hidden role="alertdialog" aria-label="Confirmar">' +
    '<p>Limpar fita e memória? Isso não pode ser desfeito.</p>' +
    '<button type="button" class="cancel">Cancelar</button><button type="button" class="ok">Limpar</button></div>';
  top.append(handle);
  calc.append(drawer);

  const set = (open) => {
    drawer.style.top = top.offsetTop + top.offsetHeight + 2 + 'px'; // logo abaixo da alça
    drawer.dataset.open = String(open);
    handle.setAttribute('aria-expanded', String(open));
  };
  handle.addEventListener('click', () => set(drawer.dataset.open !== 'true'));

  // Puxar o visor para baixo abre; para cima fecha.
  let y0 = null;
  top.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.fmt-toggle')) y0 = e.clientY;
  });
  const end = (e) => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    y0 = null;
    if (dy > SWIPE_PX) set(true);
    else if (dy < -SWIPE_PX) set(false);
  };
  // o dedo sai do visor durante o gesto: ouvir no documento inteiro
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', () => (y0 = null));

  const fmt = (v, s) => formatNumber(v, s.decimals, s.locale);
  const mem = drawer.querySelector('.mem');
  const tapeEl = drawer.querySelector('.tape');

  ctx.listeners.push((_c, s) => {
    const int = !!s.texts; // 16C: os valores já vêm escritos na base atual e não há n, i, PV, PMT, FV
    const regName = (n) => (int ? (n >= 16 ? 'R.' + (n - 16).toString(16) : 'R' + n.toString(16)).toUpperCase() : n >= 10 ? 'R.' + (n - 10) : 'R' + n);
    mem.innerHTML =
      '<div class="cards">' + (int ? '' : FIN_CARDS.map(([id, l]) => cell('card', `data-fin="${id}"`, l, fmt(s.fin[id], s))).join('')) + '</div>' +
      '<div class="regs">' + s.regs.map((v, n) => cell('reg', `data-reg="${n}"`, regName(n), int ? s.texts.regs[n] : fmt(v, s))).join('') + '</div>' +
      '<div class="stack">' + STACK_REGS.map(([id, l]) => cell('stk', `data-stk="${id}"`, l, int ? s.texts[id] : fmt(s.stack[id], s))).join('') + '</div>';
    tapeEl.innerHTML = '';
    s.tape.forEach((line, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.i = i;
      const k = document.createElement('span');
      k.className = 'keys-txt';
      k.textContent = line.keys;
      const v = document.createElement('b');
      v.textContent = line.text;
      b.append(k, v);
      li.append(b);
      tapeEl.append(li);
    });
    tapeEl.scrollTop = tapeEl.scrollHeight;
  });

  tapeEl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    engine.loadValue(engine.tape[Number(b.dataset.i)].value);
    ctx.render();
  });

  const confirm = drawer.querySelector('.confirm');
  drawer.querySelector('.clear-all').addEventListener('click', () => (confirm.hidden = false));
  confirm.querySelector('.cancel').addEventListener('click', () => (confirm.hidden = true));
  confirm.querySelector('.ok').addEventListener('click', () => {
    confirm.hidden = true;
    engine.reset();
    clearAll(engine.profile);
    ctx.render();
  });
  return { open: () => set(true), close: () => set(false) };
}

return { mountDrawer };
})();

const __m_memories = (() => {
// Memórias em arquivo: salvar, abrir e compartilhar o estado da calculadora (registradores, financeiros,
// fluxos de caixa, programa, pilha e fita). A versão 2 leva também o perfil e o modo (RPN/ALG); arquivos da versão 1 abrem como 12C. O arquivo só sai do aparelho se a pessoa o compartilhar.

const MEM_KIND = 'calc12c-memorias';
const MAX_CHARS = 2000000;

function buildMemoryFile(engine, now = new Date()) {
  const estado = JSON.parse(engine.serialize());
  estado.shift = null; // nada pendente: o arquivo guarda só o que a pessoa calculou
  estado.pending = null;
  estado.error = null;
  const text = JSON.stringify({ app: 'Calc 12c', tipo: MEM_KIND, versao: 2, perfil: engine.profile, criado: now.toISOString(), estado }, null, 2);
  return { name: `calc12c-memorias-${now.toISOString().slice(0, 10)}.json`, text };
}

// Texto do arquivo → motor novo; lança Error com mensagem em português se o arquivo não servir.
function parseMemoryFile(text) {
  if (typeof text !== 'string' || text.length > MAX_CHARS) throw new Error('Arquivo ilegível ou grande demais.');
  let o;
  try {
    o = JSON.parse(text);
  } catch {
    throw new Error('O arquivo não é um JSON válido.');
  }
  if (!o || o.tipo !== MEM_KIND || !o.estado || typeof o.estado !== 'object') throw new Error('Este arquivo não é de memórias da Calc 12c.');
  try {
    return restoreEngine(JSON.stringify(o.estado));
  } catch {
    throw new Error('O conteúdo do arquivo está inválido ou é de uma versão não suportada.');
  }
}

// Troca o estado do motor em uso pelo do motor lido (as referências ao motor continuam valendo).
// O motor lido pode ser de outro tipo (12C ↔ 16C): troca também o protótipo, que carrega os métodos.
function loadInto(engine, loaded) {
  for (const k of Object.keys(engine)) delete engine[k];
  Object.setPrototypeOf(engine, Object.getPrototypeOf(loaded));
  Object.assign(engine, loaded);
}

return { MEM_KIND, buildMemoryFile, parseMemoryFile, loadInto };

const __m_extras = (() => {
// Extras das configurações: som de tecla (Web Audio) e "não dormir" (Screen Wake Lock). Tudo opcional e sem rede.

// Som das teclas, sintetizado no navegador (sem arquivos de áudio, tudo offline). Dois momentos: ao apertar e ao soltar.
// Modos: 'soft' = clique macio; 'mech' = estalo de tecla mecânica com um "toc" grave. O contexto de áudio só nasce no primeiro toque.
function makeSound() {
  let ac = null;
  let noise = null;
  let mode = 'off';
  const PERFIL = { enter: { f: 0.72, g: 1.25 }, fg: { f: 0.85, g: 0.75 }, num: { f: 1, g: 1 }, fn: { f: 1.08, g: 1 } };
  const prepare = () => {
    const AC = window.AudioContext ?? window.webkitAudioContext;
    if (!AC) return false;
    if (!ac) {
      ac = new AC();
      noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.06), ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  };
  const env = (g, t, peak, dur) => {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  };
  return {
    get mode() {
      return mode;
    },
    set(m) {
      mode = m === 'soft' || m === 'mech' ? m : 'off';
    },
    // kind: enter | fg | num | fn   phase: down | up
    play(kind = 'num', phase = 'down') {
      if (mode === 'off') return;
      try {
        if (!prepare()) return;
        const { f, g } = PERFIL[kind] ?? PERFIL.num;
        const down = phase === 'down';
        const t = ac.currentTime;
        if (mode === 'soft') {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime((down ? 1900 : 2300) * f, t);
          osc.frequency.exponentialRampToValueAtTime((down ? 700 : 1100) * f, t + 0.025);
          env(gain, t, (down ? 0.035 : 0.015) * g, 0.03);
          osc.connect(gain).connect(ac.destination);
          osc.start(t);
          osc.stop(t + 0.04);
          return;
        }
        // mecânico: estalo filtrado (ruído) + toc grave só ao apertar
        const src = ac.createBufferSource();
        const bp = ac.createBiquadFilter();
        const gn = ac.createGain();
        src.buffer = noise;
        bp.type = 'bandpass';
        bp.frequency.value = (down ? 2600 : 3600) * f;
        bp.Q.value = 1.3;
        env(gn, t, (down ? 0.09 : 0.04) * g, down ? 0.025 : 0.018);
        src.connect(bp).connect(gn).connect(ac.destination);
        src.start(t);
        src.stop(t + 0.05);
        if (down) {
          const th = ac.createOscillator();
          const tg = ac.createGain();
          th.type = 'sine';
          th.frequency.setValueAtTime(170 * f, t);
          th.frequency.exponentialRampToValueAtTime(80 * f, t + 0.045);
          env(tg, t, 0.07 * g, 0.05);
          th.connect(tg).connect(ac.destination);
          th.start(t);
          th.stop(t + 0.06);
        }
      } catch {
        /* sem áudio: o app segue funcionando */
      }
    },
  };
}

const wakeSupported = () => typeof navigator !== 'undefined' && 'wakeLock' in navigator;

// Mantém a tela acesa enquanto o app estiver visível; o navegador solta o bloqueio ao esconder a aba, então pedimos de novo ao voltar.
function makeWake() {
  let lock = null;
  let want = false;
  const request = async () => {
    if (!want || !wakeSupported() || document.visibilityState !== 'visible') return;
    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => (lock = null));
    } catch {
      lock = null; // bateria fraca, economia de energia etc.: tenta de novo na próxima vez
    }
  };
  document.addEventListener('visibilitychange', request);
  return async (on) => {
    want = on;
    if (on) await request();
    else {
      try {
        await lock?.release();
      } catch {
        /* já solto */
      }
      lock = null;
    }
  };
}

return { makeSound, wakeSupported, makeWake };

const __m_colors = (() => {
// Editor de cores: a partir de uma cor escolhida, gera as variáveis CSS (degradês, bordas, sombras, tinta)
// que sobrepõem as do tema. Funções puras: não tocam no DOM.
const COLOR_KEYS = ['plate', 'f', 'g', 'display'];

const validHex = (h) => typeof h === 'string' && /^#[0-9a-fA-F]{6}$/.test(h);

const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0')).join('');

// t = 0 devolve a, t = 1 devolve b
function mix(a, b, t) {
  const [x, y] = [rgb(a), rgb(b)];
  return hex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t);
}
const lighten = (h, t) => mix(h, '#ffffff', t);
const darken = (h, t) => mix(h, '#000000', t);

// Luminância relativa (WCAG) de 0 a 1
function luminance(h) {
  const [r, g, b] = rgb(h).map((v) => {
    const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

// Tinta legível sobre a cor: escura em fundos claros, branca em fundos escuros
const inkOn = (h) => (luminance(h) > 0.4 ? '#14110a' : '#ffffff');

// colors = { plate, f, g, display }, cada uma #rrggbb ou null (null = cor do tema). Devolve { '--variável': valor }.
function customVars(colors = {}) {
  const v = {};
  const { plate, f, g, display } = colors;
  if (validHex(plate)) {
    Object.assign(v, {
      '--plate-a': darken(plate, 0.22), '--plate-b': lighten(plate, 0.3), '--plate-c': plate,
      '--plate-edge': darken(plate, 0.45), '--plate-ink': darken(plate, 0.75),
      '--brand': plate, '--edge': darken(plate, 0.2), '--rim-a': lighten(plate, 0.15), '--rim-b': darken(plate, 0.35),
    });
  }
  if (validHex(f)) {
    Object.assign(v, {
      '--gold': f, '--keyf-bg': `linear-gradient(${lighten(f, 0.2)}, ${darken(f, 0.2)})`, '--keyf-border': lighten(f, 0.12),
      '--keyf-text': inkOn(f), '--keyf-shadow': `0 2px 0 ${darken(f, 0.65)}, inset 0 1px 0 #ffffff55`, '--flash-f': f + 'e6',
    });
  }
  if (validHex(g)) {
    Object.assign(v, {
      '--blue': g, '--keyg-bg': `linear-gradient(${lighten(g, 0.2)}, ${darken(g, 0.2)})`, '--keyg-border': lighten(g, 0.12),
      '--keyg-text': inkOn(g), '--keyg-shadow': `0 2px 0 ${darken(g, 0.65)}, inset 0 1px 0 #ffffff59`, '--flash-g': g + 'e6',
    });
  }
  if (validHex(display)) Object.assign(v, { '--display-text': display, '--display-glow': `0 0 12px ${display}8c`, '--ind-on': display });
  return v;
}

return { COLOR_KEYS, validHex, mix, lighten, darken, luminance, inkOn, customVars };
})();

// Uma única camada de brilho cobre todo o vidro (placa, visor e teclado); a .sheen reforça só a placa metálica
function ensureReflexLayer(reduce) {
  const calc = document.querySelector('.calc');
  if (!calc) return;
  const clip = calc.querySelector(':scope > .reflex-clip');
  if (reduce) {
    clip?.remove();
    return;
  }
  if (clip) return;
  const c = document.createElement('div');
  c.className = 'reflex-clip';
  c.setAttribute('aria-hidden', 'true');
  c.innerHTML = '<div class="reflex"></div><div class="sheen-clip"><div class="sheen"></div></div>';

  root.setAttribute('data-theme', resolved);
  root.setAttribute('data-reduce', String(!!reduceEffects));
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim());
  ensureReflexLayer(!!reduceEffects);
  document.dispatchEvent(new CustomEvent('calc12c:effects', { detail: { reduce: !!reduceEffects } }));

    mq = window.matchMedia('(prefers-color-scheme: dark)');

    setTimeout(() => keyUp(b), 90);
  };
  // tecla ON: um toque abre/fecha as configurações; segurar abre/fecha o verso (guia de fórmulas)
  const HOLD_MS = 500;
  let holdTimer;
  let held = false;
  const getOnKey = () => keys.querySelector('button.key[data-id="on"]');
  function bindOnKey() { // a tecla é refeita quando o perfil muda: os ouvintes dela são ligados a cada montagem
    const onKey = getOnKey();
    onKey.addEventListener('pointerdown', () => {
      held = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        held = true;
        haptic(20);
        ctx.verso.toggle();
      }, HOLD_MS);
    });
    for (const t of ['pointerup', 'pointercancel', 'pointerleave']) onKey.addEventListener(t, () => clearTimeout(holdTimer));
    onKey.addEventListener('contextmenu', (ev) => ev.preventDefault()); // o menu de "segurar" do celular não deve abrir
  }
  // rótulo da tecla ON: "≡" (menu) ou "ON"; sem o "OFF" impresso, já que a tecla agora abre as configurações
  ctx.setOnStyle = (style) => {
    const onKey = getOnKey();
    const menu = style !== 'on';
    onKey.querySelector('.lm').textContent = menu ? '≡' : 'ON';
    onKey.querySelector('.lf').textContent = menu ? '' : 'OFF'; // no estilo ON mantém o rótulo impresso da HP
    onKey.classList.toggle('menu-key', menu);
    onKey.setAttribute('aria-label', (menu ? 'Menu' : 'ON') + ': toque para as configurações, segure para o verso');
  };
  buildKeys();
  ctx.setOnStyle('on');
  ctx.onTap = () => {
    if (ctx.verso.isOpen()) ctx.verso.close();
    else ctx.settings.toggle();
  };
  keys.addEventListener('click', (ev) => {
    const b = ev.target.closest('button.key');
    if (!b) return;
    const k = ctx.profile.keys.find((x) => x.id === b.dataset.id);
    if (k.id === 'on') {
      if (held) held = false; // o segurar já abriu o verso; o clique que vem ao soltar não faz mais nada
      else {
        haptic(12);
        ctx.onTap();
      }
      ctx.hapticOk = false;
      return;
    }
    if (!k.enabled) {
      showNotice('Programação e estatística: não disponível nesta versão.');
      return;
    }
    if (!ctx.hapticOk) haptic(12);
    ctx.hapticOk = false;
    ctx.pressKey(k.id);
  });
  bindKeyboard(engine, ctx.render);
  ctx.drawer = mountDrawer(ctx);
  // o reflexo liga e desliga junto com "reduzir efeitos"
  let motion = false;
  document.addEventListener('calc12c:effects', (e) => {
    ctx.reflex?.stop();
    ctx.reflex = null;
    const layer = calc.querySelector('.reflex');
    if (!e.detail.reduce && layer) {
      ctx.reflex = startReflex(layer);
      if (motion) ctx.reflex.enableMotion();
      else if (!ctx.reflex.needsPermission) ctx.enableMotion(); // Android e PC: sensor liga sozinho
      else {
        // iPhone: o sensor pede permissão, e ela só pode ser pedida num toque do usuário
        document.addEventListener('pointerup', () => ctx.enableMotion(), { once: true });
      }
    }
  });
  ctx.enableMotion = async () => {
    motion = (await ctx.reflex?.enableMotion()) ?? false;
    return motion;
  };
  ctx.verso = mountVerso(ctx);
  // Troca de perfil: guarda o estado do atual, carrega o do novo (cada perfil tem o seu) e refaz teclado, selo e verso.
  // `adoptProfile` também serve quando um arquivo de memórias de outro perfil é aberto.
  ctx.adoptProfile = () => {
    if (engine.profile === ctx.profile.id) return false;
    ctx.profile = getProfile(engine.profile);
    saveActiveProfile(engine.profile);
    buildKeys();
    ctx.setOnStyle(ctx.settings?.get().onStyle ?? 'on');
    ctx.verso.el.remove();
    ctx.verso = mountVerso(ctx);
    ctx.settings?.refresh(); // o tema depende do perfil
    ctx.render();
    return true;
  };
  ctx.setProfile = (id) => {
    if (id === engine.profile) return;
    saveState(engine);
    loadInto(engine, loadState(id));
    ctx.adoptProfile();
  };
  ctx.settings = mountSettings(ctx);
  ctx.listeners.push(() => saveState(engine)); // salvamento automático
  ctx.render();
  return ctx;
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return; // file:// não tem service worker
  navigator.serviceWorker.register('./sw.js').catch(() => {}); // sem SW o app segue funcionando
}

// Altura real da área visível: em alguns celulares (tela cheia, PWA, barra de status) o 100dvh vem maior que a janela
// e as últimas fileiras de teclas ficam para fora. Medimos a janela de verdade e deixamos o CSS usar o menor valor.
function trackViewportHeight() {
  const set = () => {
    const h = Math.round(Math.min(window.innerHeight, window.visualViewport?.height ?? Infinity));
    if (h > 0) document.documentElement.style.setProperty('--app-h', h + 'px');
  };
  set();
  window.addEventListener('resize', set);
  window.visualViewport?.addEventListener('resize', set);
  window.addEventListener('orientationchange', () => setTimeout(set, 250));
  // entrar/sair da tela cheia anima: mede de novo quando o navegador termina
  document.addEventListener('fullscreenchange', () => [100, 350, 900].forEach((ms) => setTimeout(set, ms)));
}

const root = document.getElementById('app');
if (root) {
  trackViewportHeight();
  window.calc12c = mountApp(root, loadState());
  registerServiceWorker();
}

return { mountApp };
})();
</script>
</body>
</html>
