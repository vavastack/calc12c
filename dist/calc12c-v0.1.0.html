<style>
/* Temas: só variáveis de cor, material, sombra e brilho. O teclado e o motor nunca mudam.
   Paleta da tela "demonstração dos temas": preto, dourado (f), azul (g) e champanhe do metal. */

/* Retro: preto e dourado, teclas com relevo, visor luminoso ciano (padrão) */
:root, [data-theme="retro"] {
  --bg: #0b0b0c;
  --body: #0b0b0c; --body-solid: #0b0b0c;
  --edge: #8a6a2c; --edge-w: 2px;
  --brand: #d9a63a; --sub: #8d8d92; --hint: #8d8d92;
  --key-flat: #232326;
  --key-bg: linear-gradient(#2c2c2f, #19191b); --key-border: #3d3d41;
  --key-shadow: 0 2px 0 #050505, inset 0 1px 0 #ffffff14;
  --key-text: #f2f2f2; --gold: #f0b429; --blue: #4aa8ff;
  --keyf-bg: linear-gradient(#f6c764, #c8922a); --keyf-border: #e3b04a; --keyf-text: #1a1205;
  --keyf-shadow: 0 2px 0 #5c4210, inset 0 1px 0 #ffffff66; --flash-f: #ffd978e6;
  --keyg-bg: linear-gradient(#3b97ff, #1b63d1); --keyg-border: #5aa8ff; --keyg-text: #ffffff;
  --keyg-shadow: 0 2px 0 #0b2f6b, inset 0 1px 0 #ffffff59; --flash-g: #7dbdffe6;
  --display-bg: #050607; --display-solid: #050607; --display-border: #6b5420;
  --display-shadow: inset 0 0 18px #000c; --display-text: #aef2ff;
  --display-glow: 0 0 12px #78dcff8c;
  --ind-on: #f0b429; --ind-off: #55555a; --handle: #3a3a3e;
  --glass: none;
  --glow: none;
  --reflex: linear-gradient(115deg, transparent 28%, #ffd98a2e 44%, #ffffff12 52%, transparent 66%);
}

/* Moderno escuro: vidro translúcido em grafite, halos dourado e azul nos cantos, reflexo suave */
[data-theme="moderno-escuro"] {
  --bg: #0a0b0e;
  --body: linear-gradient(160deg, #171a21 0%, #0c0d11 60%, #0a0b0e 100%); --body-solid: #101217;
  --edge: #e8d6aa8c; --edge-w: 1.5px;
  --brand: #f2cf7a; --sub: #a4a9b4; --hint: #a4a9b4;
  --key-flat: #2a2e36;
  --key-bg: linear-gradient(#ffffff26, #ffffff0d); --key-border: #ffffff2b;
  --key-shadow: inset 0 1px 0 #ffffff47, 0 4px 10px #00000059;
  --key-text: #f4f5f7; --gold: #f5c451; --blue: #7dc0ff;
  --keyf-bg: linear-gradient(#ffd064a0, #d6961e66); --keyf-border: #ffdc8c8c; --keyf-text: #fff8e6;
  --keyf-shadow: inset 0 1px 0 #ffffff66, 0 4px 12px #d6961e4d; --flash-f: #ffd978e6;
  --keyg-bg: linear-gradient(#64afffad, #286ee673); --keyg-border: #96c8ff99; --keyg-text: #ffffff;
  --keyg-shadow: inset 0 1px 0 #ffffff66, 0 4px 12px #286ee659; --flash-g: #7dbdffe6;
  --display-bg: linear-gradient(#ffffff1a, #ffffff08); --display-solid: #14171d; --display-border: #ffffff29;
  --display-shadow: inset 0 1px 0 #ffffff38; --display-text: #eafcff;
  --display-glow: 0 0 10px #96dcff59;
  --ind-on: #f5c451; --ind-off: #5d626d; --handle: #ffffff47;
  --glass: blur(14px) saturate(1.2);
  --glow: radial-gradient(260px 220px at 8% 6%, #f0b42947, transparent 70%),
          radial-gradient(300px 260px at 95% 92%, #3a8cff4d, transparent 70%);
  --reflex: linear-gradient(115deg, transparent 28%, #ffffff30 44%, #ffffff0f 52%, transparent 66%);
}

/* Moderno claro: vidro claro em champanhe e marfim, com as mesmas cores de f e g */
[data-theme="moderno-claro"] {
  --bg: #efe5d2;
  --body: linear-gradient(160deg, #f6efe2 0%, #eadfca 100%); --body-solid: #f1e8d6;
  --edge: #96733288; --edge-w: 1.5px;
  --brand: #8a5d00; --sub: #6b5f48; --hint: #6b5f48;
  --key-flat: #f4eddc;
  --key-bg: linear-gradient(#ffffffe0, #ffffff75); --key-border: #78613238;
  --key-shadow: inset 0 1px 0 #fff, 0 3px 8px #6e55282e;
  --key-text: #241d10; --gold: #8a5d00; --blue: #0a5fd0;
  --keyf-bg: linear-gradient(#ffd064fa, #e6a52dcc); --keyf-border: #c89632b3; --keyf-text: #2a1d00;
  --keyf-shadow: inset 0 1px 0 #ffffffb3, 0 3px 8px #c88c1e4d; --flash-f: #fff0b8f2;
  --keyg-bg: linear-gradient(#82beffFa, #3c82ebd1); --keyg-border: #3c78dc99; --keyg-text: #06203f;
  --keyg-shadow: inset 0 1px 0 #ffffffb3, 0 3px 8px #2864dc47; --flash-g: #cfe5fff2;
  --display-bg: linear-gradient(#ffffffcc, #ffffff6b); --display-solid: #fffcf4; --display-border: #785f3240;
  --display-shadow: inset 0 1px 0 #fff; --display-text: #0f2231;
  --display-glow: none;
  --ind-on: #8a5d00; --ind-off: #b8a98a; --handle: #cbbd9d;
  --glass: blur(14px) saturate(1.1);
  --glow: radial-gradient(260px 220px at 8% 6%, #f0b42961, transparent 70%),
          radial-gradient(300px 260px at 95% 92%, #3a8cff3d, transparent 70%);
  --reflex: linear-gradient(115deg, transparent 26%, #ffffff66 44%, #ffffff1f 54%, transparent 68%);
}

/* Reduzir efeitos: vidro sólido, sem reflexo (liga sozinho em aparelhos simples) */
[data-reduce="true"] {
  --glass: none;
  --body: var(--body-solid);
  --display-bg: var(--display-solid);
  --key-bg: var(--key-flat);
  --glow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--key-text);
  font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

/* ---- corpo da calculadora (o vidro fica só aqui e no visor) ---- */
.calc { height: 100dvh; max-width: 560px; margin: 0 auto; display: grid;
  /* a borda da calculadora acompanha a área segura (notch, cantos, barra inferior) */
  padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  grid-template-rows: auto 1fr; gap: 8px; background: var(--body); border: var(--edge-w, 1px) solid var(--edge); position: relative; isolation: isolate;
  -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.calc::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--glow, none); }
.top { position: relative; z-index: 1; }
.brand { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px; }
.brand .name { font-size: 15px; font-weight: 600; letter-spacing: .02em; color: var(--brand); }
.brand .sub { font-size: 11px; color: var(--sub); }

/* ---- visor ---- */
.display { min-height: 88px; background: var(--display-bg); color: var(--display-text); border-radius: 18px; padding: 8px 16px;
  border: 1px solid var(--display-border); box-shadow: var(--display-shadow);
  display: grid; grid-template-rows: auto 1fr auto; gap: 2px; -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); }
.indicators { display: flex; gap: 10px; font-size: 11px; font-weight: 700; align-items: center; }
.indicators [data-ind] { color: var(--ind-off); }
.indicators [data-ind].on { color: var(--ind-on); }
.fmt-toggle { margin-left: auto; font: inherit; font-size: 11px; border: 1px solid currentColor; background: transparent;
  color: inherit; border-radius: 8px; padding: 1px 8px; opacity: .7; }
.digits { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 44px; text-align: right; white-space: nowrap;
  overflow: hidden; line-height: 1.1; text-shadow: var(--display-glow); }
.msg { min-height: 1.2em; font-size: 12px; text-align: right; }

/* ---- teclado ---- */
.keys { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(8, 1fr); gap: 8px; min-height: 0; position: relative; z-index: 1; overflow: clip; }
.key { grid-column: calc(var(--c) + 1); grid-row: calc(var(--r) + 1) / span var(--rs, 1);
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  background: var(--key-bg); box-shadow: var(--key-shadow); color: var(--key-text); border: 1px solid var(--key-border); border-radius: 13px;
  position: relative; padding: 4px 0 3px; font: inherit; min-width: 0; min-height: 0; }
.key:active { filter: brightness(1.25); }
.key .lf { color: var(--gold); font-size: 9.5px; font-weight: 600; white-space: nowrap; line-height: 1; min-height: 10px; }
.key .lg { color: var(--blue); font-size: 9.5px; font-weight: 600; white-space: nowrap; line-height: 1; min-height: 10px; }
.key .lm { font-size: 18px; font-weight: 500; flex: 1; display: flex; align-items: center; }
.key.big .lm { font-size: 22px; }
.key.small .lm { font-size: 14px; }
.key.prefix-f { background: var(--keyf-bg); border-color: var(--keyf-border); color: var(--keyf-text); box-shadow: var(--keyf-shadow); --flash: var(--flash-f); }
.key.prefix-g { background: var(--keyg-bg); border-color: var(--keyg-border); color: var(--keyg-text); box-shadow: var(--keyg-shadow); --flash: var(--flash-g); }
.key.prefix-f .lm, .key.prefix-g .lm { font-style: italic; font-weight: 700; font-size: 22px; }
.key[aria-disabled="true"] { opacity: .45; }
.key .lf, .key .lg { transition: opacity .2s; }
.calc[data-shift="f"] .key .lg { opacity: .2; }
.calc[data-shift="g"] .key .lf { opacity: .2; }
.calc[data-shift="f"] .key .lf, .calc[data-shift="g"] .key .lg { opacity: 1; font-weight: 700; }

const __m_stack = (() => {
// Pilha RPN da HP 12C (X, Y, Z, T, LastX) com digitação e regra de elevação.
const MAX_DIGITS = 10;

function countDigits(body) {
  if (body.includes('.')) {
    const [i, f] = body.split('.');
    return (i === '0' ? 0 : i.length) + f.length;
  }
  return body === '0' ? 0 : body.length;

class Stack {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.z = 0;
    this.t = 0;
    this.lastX = 0;
    this.entering = false; // há um número sendo digitado
    this.liftEnabled = true; // o próximo número digitado eleva a pilha?
    this._mant = ''; // mantissa digitada, com sinal
    this._exp = null; // { sign: ''|'-', digits: '' } quando em modo EEX
  }

  _lift() {
    this.t = this.z;
    this.z = this.y;
    this.y = this.x;
  }

  _startEntry(initialMant) {
    if (this.liftEnabled) this._lift();
    this._mant = initialMant;
    this._exp = null;
    this.entering = true;
    this.liftEnabled = true;
  }

  _parseEntry() {

    if (this._exp) m += 'e' + this._exp.sign + (this._exp.digits || '0');
    return Number(m);

  commit() {
    if (this.entering) {
      this.x = this._parseEntry();
      this.entering = false;
    }
  }

  entryText() {

    let t = this._mant;
    if (this._exp) t += 'e' + this._exp.sign + this._exp.digits;

  }

    if (this._exp) {

    } else {

      } else if (countDigits(body) < MAX_DIGITS) {

      }
      this._mant = (neg ? '-' : '') + body;

  }

    else if (this._exp) return;
    else if (!this._mant.includes('.')) {

    this.x = this._parseEntry();
  }

  eex() {
    if (!this.entering) this._startEntry('1');
    if (!this._exp) this._exp = { sign: '', digits: '' };
    this.x = this._parseEntry();

// Arredonda para 10 dígitos significativos.
function round10(x) {
  if (!Number.isFinite(x)) return x;
  return Number(x.toPrecision(10));

// Formata com `decimals` casas e separadores pt-BR ('br') ou en-US ('us').
function formatNumber(x, decimals, locale = 'br') {
  const fixed = Math.abs(x).toFixed(decimals);

  const thousands = locale === 'br' ? '.' : ',';

  minus: (y, x) => y - x,
  times: (y, x) => y * x,
  divide: (y, x) => {
    if (x === 0) throw new CalcError(0);

    return ((x - y) / y) * 100;

  pctT: (y, x) => {

    return (x / y) * 100;

function annuityFactor(ii, n) {

    if (!e.target.closest('.fmt-toggle')) y0 = e.clientY;
  });
  const end = (e) => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    y0 = null;
    if (dy > SWIPE_PX) set(true);
    else if (dy < -SWIPE_PX) set(false);
  };
  // o dedo sai do visor durante o gesto: ouvir no documento inteiro
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', () => (y0 = null));

  const fmt = (v, s) => formatNumber(v, s.decimals, s.locale);
  const mem = drawer.querySelector('.mem');
  const tapeEl = drawer.querySelector('.tape');

  ctx.listeners.push((_c, s) => {
    mem.innerHTML =
      '<div class="cards">' + FIN_CARDS.map(([id, l]) => cell('card', `data-fin="${id}"`, l, fmt(s.fin[id], s))).join('') + '</div>' +
      '<div class="regs">' + s.regs.map((v, n) => cell('reg', `data-reg="${n}"`, 'R' + n, fmt(v, s))).join('') + '</div>' +
      '<div class="stack">' + STACK_REGS.map(([id, l]) => cell('stk', `data-stk="${id}"`, l, fmt(s.stack[id], s))).join('') + '</div>';
    tapeEl.innerHTML = '';
    s.tape.forEach((line, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.i = i;
      const k = document.createElement('span');
      k.className = 'keys-txt';
      k.textContent = line.keys;
      const v = document.createElement('b');
      v.textContent = line.text;
      b.append(k, v);
      li.append(b);
      tapeEl.append(li);
    });
    tapeEl.scrollTop = tapeEl.scrollHeight;
  });

  tapeEl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    engine.loadValue(engine.tape[Number(b.dataset.i)].value);
    ctx.render();
  });

  const confirm = drawer.querySelector('.confirm');
  drawer.querySelector('.clear-all').addEventListener('click', () => (confirm.hidden = false));
  confirm.querySelector('.cancel').addEventListener('click', () => (confirm.hidden = true));
  confirm.querySelector('.ok').addEventListener('click', () => {
    confirm.hidden = true;
    engine.reset();
    clearAll();
    ctx.render();
  });
  return { open: () => set(true), close: () => set(false) };
}

return { mountDrawer };
})();

const __m_settings = (() => {
// Temas e configurações. Só variáveis de cor mudam; o teclado e o motor nunca.
const KEY = 'calc12c.settings';
const THEMES = ['retro', 'moderno'];
const MODES = ['auto', 'escuro', 'claro'];

const lowEnd = () => (navigator.hardwareConcurrency ?? 8) <= 2 || (navigator.deviceMemory ?? 8) <= 2 ||
  matchMedia('(prefers-reduced-motion: reduce)').matches;

function defaultSettings() {
  // reduce: null = automático (liga sozinho em aparelhos simples); true/false = escolha do usuário
  return { theme: 'retro', mode: 'auto', reduce: null, vibrate: false };
}

function loadSettings() {
  const d = defaultSettings();
  try {
    const o = JSON.parse(window.localStorage.getItem(KEY) ?? 'null');
    if (!o || typeof o !== 'object') return d;
    return {
      theme: THEMES.includes(o.theme) ? o.theme : d.theme,
      mode: MODES.includes(o.mode) ? o.mode : d.mode,
      reduce: typeof o.reduce === 'boolean' ? o.reduce : null,
      vibrate: o.vibrate === true,
    };
  } catch {
    return d; // ausente, corrompido ou armazenamento bloqueado
  }
}

function saveSettings(s) {
  try {
    window.localStorage.setItem(KEY, JSON.stringify(s));
  } catch {
    /* sem armazenamento: segue funcionando */
  }
}

const effectiveReduce = (s) => (s.reduce === null ? lowEnd() : s.reduce);

let last = { theme: 'retro', mode: 'auto', reduce: false };
let mq;

function ensureReflexLayer(reduce) {
  const keys = document.querySelector('.keys');
  if (!keys) return;
  const el = keys.querySelector('.reflex');
  if (reduce && el) el.remove();
  if (!reduce && !el) {
    const d = document.createElement('div');
    d.className = 'reflex';
    d.setAttribute('aria-hidden', 'true');
    keys.append(d);
  }
}

function applyTheme(theme, mode, reduceEffects) {
  last = { theme, mode, reduce: !!reduceEffects };
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const resolved = theme === 'retro' ? 'retro' : 'moderno-' + (mode === 'auto' ? (dark ? 'escuro' : 'claro') : mode);
  const root = document.documentElement;
  root.setAttribute('data-theme', resolved);
  root.setAttribute('data-reduce', String(!!reduceEffects));
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim());
  ensureReflexLayer(!!reduceEffects);
  document.dispatchEvent(new CustomEvent('calc12c:effects', { detail: { reduce: !!reduceEffects } }));
  if (!mq) {
    mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', () => last.mode === 'auto' && applyTheme(last.theme, last.mode, last.reduce));
  }
}

function mountSettings(ctx) {
  let s = loadSettings();
  const apply = () => {
    applyTheme(s.theme, s.mode, effectiveReduce(s));
    ctx.vibrate = s.vibrate;
  };
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'settings-btn';
  btn.setAttribute('aria-label', 'Configurações');
  btn.textContent = '⚙';
  const panel = document.createElement('section');
  panel.className = 'settings';
  panel.hidden = true;
  panel.innerHTML =
    '<label>Tema <select name="theme"><option value="retro">Retro</option><option value="moderno">Moderno</option></select></label>' +
    '<label>Modo <select name="mode"><option value="auto">Automático</option><option value="escuro">Escuro</option><option value="claro">Claro</option></select></label>' +
    '<label>Reduzir efeitos <input type="checkbox" name="reduce"></label>' +
    '<label>Vibração leve ao tocar <input type="checkbox" name="vibrate"></label>' +
    '<button type="button" class="motion">Ativar movimento do aparelho (brilho)</button>';
  ctx.top.append(btn);
  ctx.calc.append(panel);
  const sync = () => {
    panel.querySelector('[name=theme]').value = s.theme;
    panel.querySelector('[name=mode]').value = s.mode;
    panel.querySelector('[name=reduce]').checked = effectiveReduce(s);
    panel.querySelector('[name=vibrate]').checked = s.vibrate;
  };
  panel.querySelector('.motion').addEventListener('click', () => ctx.enableMotion?.());
  btn.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    sync();
  });
  panel.addEventListener('change', (e) => {
    const n = e.target.name;
    if (n === 'theme' || n === 'mode') s[n] = e.target.value;
    else s[n] = e.target.checked; // reduce, vibrate
    saveSettings(s);
    apply();
  });
  apply();
  return { get: () => ({ ...s }) };
}

return { defaultSettings, loadSettings, saveSettings, applyTheme, mountSettings };
})();

const __m_reflex = (() => {
// Reflexo leve: uma única camada de brilho que se desloca com o mouse (PC) ou a inclinação (celular).
// Só `transform` e `opacity`; no máximo uma escrita por quadro; pausa em segundo plano.
const RANGE_X = 90; // px de deslocamento máximo
const RANGE_Y = 120;
const SMOOTH = 0.18; // amortecimento por quadro
const MIN_DELTA = 0.01; // variação mínima do alvo para valer a pena atualizar
const EPS = 0.002;

function startReflex(layer) {
  let target = { x: 0, y: 0 };
  let cur = { x: 0, y: 0 };
  let raf = 0;
  let stopped = false;
  let motionOn = false;

  const frame = () => {
    raf = 0;
    if (stopped || document.hidden) return;
    cur.x += (target.x - cur.x) * SMOOTH;
    cur.y += (target.y - cur.y) * SMOOTH;
    const done = Math.abs(target.x - cur.x) < EPS && Math.abs(target.y - cur.y) < EPS;
    if (done) cur = { ...target };
    layer.style.transform = `translate3d(${(cur.x * RANGE_X).toFixed(2)}px, ${(cur.y * RANGE_Y).toFixed(2)}px, 0)`;
    layer.style.opacity = String((0.55 + 0.25 * Math.abs(cur.x)).toFixed(3));
    if (!done) raf = requestAnimationFrame(frame);
  };

  const aim = (x, y) => {
    if (stopped || document.hidden) return;
    x = Math.max(-1, Math.min(1, x));
    y = Math.max(-1, Math.min(1, y));
    if (Math.abs(x - target.x) < MIN_DELTA && Math.abs(y - target.y) < MIN_DELTA) return;
    target = { x, y };
    if (!raf) raf = requestAnimationFrame(frame); // várias entradas no mesmo quadro = 1 escrita
  };

  const onMouse = (e) => aim((e.clientX / window.innerWidth) * 2 - 1, (e.clientY / window.innerHeight) * 2 - 1);
  const onTilt = (e) => {
    if (e.gamma == null && e.beta == null) return;
    aim((e.gamma ?? 0) / 25, ((e.beta ?? 50) - 50) / 25); // ~25° de inclinação já leva o reflexo ao limite
  };
  const onVisibility = () => {
    if (document.hidden && raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
  };

  // mouse no PC; dedo no celular (qualquer toque ou arraste move o reflexo, mesmo sem sensor de movimento)
  document.addEventListener('pointermove', onMouse);
  document.addEventListener('pointerdown', onMouse);
  document.addEventListener('visibilitychange', onVisibility);

  return {
    // No iPhone o sensor exige permissão, pedida num toque do usuário. Negada → brilho fixo.
    get needsPermission() {
      return typeof window.DeviceOrientationEvent?.requestPermission === 'function';
    },
    async enableMotion() {
      if (motionOn || stopped) return false;
      const D = window.DeviceOrientationEvent;
      if (!D) return false;
      try {
        if (typeof D.requestPermission === 'function' && (await D.requestPermission()) !== 'granted') return false;
      } catch {
        return false;
      }
      window.addEventListener('deviceorientation', onTilt);
      motionOn = true;
      return true;
    },
    stop() {
      stopped = true;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      document.removeEventListener('pointermove', onMouse);
      document.removeEventListener('pointerdown', onMouse);
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('deviceorientation', onTilt);
    },
  };
}

return { startReflex };
})();

const __m_app = (() => {
const { KEYS } = __m_keymap;
const { Engine } = __m_engine;
const { renderDisplay, bindKeyboard } = __m_display;
const { mountDrawer } = __m_tape;
const { loadState, saveState } = __m_storage;
const { mountSettings } = __m_settings;
const { startReflex } = __m_reflex;

const NOTICE_MS = 2200;

// Posição no layout horizontal (4 × 10): metade de baixo do vertical vai para as colunas 6 a 10.
const hpos = (k) => (k.row < 4 ? { r: k.row, c: k.col } : { r: k.row - 4, c: k.col + 5 });

function ariaLabel(k) {
  const parts = [k.label];
  if (k.f) parts.push('f ' + k.f);
  if (k.g) parts.push('g ' + k.g);
  return parts.join('; ');
}

function makeKey(k) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'key';
  const g = k.label.length;
  if (/^[0-9.]$/.test(k.label) || ['÷', '×', '−', '+'].includes(k.label)) b.classList.add('big');
  else if (k.id === 'enter') b.classList.add('small');
  else if (g > 3 && k.id !== 'f' && k.id !== 'g') b.classList.add('small');
  b.dataset.id = k.id;
  if (k.id === 'f' || k.id === 'g') b.classList.add('prefix-' + k.id);
  const h = hpos(k);
  b.style.setProperty('--r', k.row);
  b.style.setProperty('--c', k.col);
  b.style.setProperty('--hr', h.r);
  b.style.setProperty('--hc', h.c);
  b.style.setProperty('--rs', k.rowSpan ?? 1);
  b.setAttribute('aria-label', ariaLabel(k));
  if (!k.enabled) b.setAttribute('aria-disabled', 'true');
  b.innerHTML =
    `<span class="lf">${k.f ?? ''}</span><span class="lm">${k.label}</span><span class="lg">${k.g ?? ''}</span>`;
  return b;
}

function mountApp(root, engine = new Engine()) {
  root.innerHTML = '';
  const calc = document.createElement('main');
  calc.className = 'calc';
  const display = document.createElement('section');
  display.className = 'display';
  display.setAttribute('aria-live', 'polite');
  const keys = document.createElement('section');
  keys.className = 'keys';
  const notice = document.createElement('div');
  notice.className = 'notice';
  notice.hidden = true;
  notice.setAttribute('role', 'status');
  for (const k of KEYS) keys.append(makeKey(k));
  const top = document.createElement('div');
  top.className = 'top';
  const brand = document.createElement('div');
  brand.className = 'brand';
  brand.innerHTML = '<span class="name">Calc 12C</span><span class="sub">RPN · 4 casas</span>';
  top.append(brand, display);
  calc.append(top, keys, notice);
  root.append(calc);

  let timer;
  const showNotice = (text) => {
    notice.textContent = text;
    notice.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(() => (notice.hidden = true), NOTICE_MS);
  };

  const ctx = { root, calc, top, display, keys, notice, engine, showNotice, listeners: [], vibrate: false };
  ctx.render = () => {
    const s = engine.state;
    renderDisplay(display, s);
    calc.dataset.shift = s.shift ?? '';
    ctx.listeners.forEach((fn) => fn(ctx, s));
  };
  display.addEventListener('click', (ev) => {
    if (!ev.target.closest('.fmt-toggle')) return;
    engine.setLocale(engine.locale === 'br' ? 'us' : 'br');
    ctx.render();
  });
  keys.addEventListener('click', (ev) => {
    const b = ev.target.closest('button.key');
    if (!b) return;
    const k = KEYS.find((x) => x.id === b.dataset.id);
    if (!k.enabled) {
      showNotice('Programação e estatística: não disponível nesta versão.');
      return;
    }
    if (ctx.vibrate && navigator.vibrate) navigator.vibrate(8);
    if (k.id === 'f' || k.id === 'g') {
      // brilho curto da tecla f/g; reinicia a animação a cada toque
      b.classList.remove('flash');
      void b.offsetWidth;
      b.classList.add('flash');
      b.addEventListener('animationend', () => b.classList.remove('flash'), { once: true });
    }
    engine.press(k.id);
    ctx.render();
  });
  bindKeyboard(engine, ctx.render);
  ctx.drawer = mountDrawer(ctx);
  // o reflexo liga e desliga junto com "reduzir efeitos"
  let motion = false;
  document.addEventListener('calc12c:effects', (e) => {
    ctx.reflex?.stop();
    ctx.reflex = null;
    const layer = keys.querySelector('.reflex');
    if (!e.detail.reduce && layer) {
      ctx.reflex = startReflex(layer);
      if (motion) ctx.reflex.enableMotion();
      else if (!ctx.reflex.needsPermission) ctx.enableMotion(); // Android e PC: sensor liga sozinho
      else {
        // iPhone: o sensor pede permissão, e ela só pode ser pedida num toque do usuário
        document.addEventListener('pointerup', () => ctx.enableMotion(), { once: true });
      }
    }
  });
  ctx.enableMotion = async () => {
    motion = (await ctx.reflex?.enableMotion()) ?? false;
    return motion;
  };
  ctx.settings = mountSettings(ctx);
  ctx.listeners.push(() => saveState(engine)); // salvamento automático
  ctx.render();
  return ctx;
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return; // file:// não tem service worker
  navigator.serviceWorker.register('./sw.js').catch(() => {}); // sem SW o app segue funcionando
}

const root = document.getElementById('app');
if (root) {
  window.calc12c = mountApp(root, loadState());
  registerServiceWorker();
}

return { mountApp };
})();
</script>
